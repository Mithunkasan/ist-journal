version: "3.8"
services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dorqssw4i # Assuming you want to hard-code it here, alternatively, use an environment variable
    ports:
      - "3000:3000"
    environment:
      # - DATABASE_URL=postgres://icare_admin:Password@db:5432/iCare4DM_db
      - DATABASE_URL=postgresql://postgres:password@localhost:5432/ist_journal_db
      # - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME= ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
    depends_on:
      - db
  db:
    image: postgres
    environment:
      - POSTGRES_DB=Journal
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
